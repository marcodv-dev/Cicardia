<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#0E0F0C" rx="32"/>

  <!-- FORCHETTA (Sinistra) -->
  <g id="forchetta" stroke="#F3F0E7">
    <!-- Conca e rebbetti esterni -->
    <path d="M 24 56 V 96 A 12 12 0 0 0 48 96 V 56" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="3"/>
          
    <!-- Rebbetti interni -->
    <line x1="32" y1="56" x2="32" y2="106" stroke-linecap="round" stroke-width="3"/>
    <line x1="40" y1="56" x2="40" y2="106" stroke-linecap="round" stroke-width="3"/>

    <!-- Manico -->
    <line x1="36" y1="108" x2="36" y2="200" stroke-linecap="round" stroke-width="3"/>
  </g>

  <!-- PIATTO C (Centro) -->
  <g id="piatto-c" stroke="#0078E1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- Bordo esterno a C -->
    <path d="M 178.91 77.09 A 72 72 0 1 0 178.91 178.91"/>
          
    <!-- Cerchio interno a C -->
    <path d="M 161.94 94.06 A 48 48 0 1 0 161.94 161.94"/>
  </g>

  <!-- COLTELLO (Destra) -->
  <g id="coltello" stroke="#F3F0E7">
    <!-- Profilo Lama Allungata -->
    <path d="M 220 56 C 198 56, 198 92, 198 134 H 220 Z" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="3"/>
            
    <!-- Manico / Linea Schiena -->
    <line x1="220" y1="56" x2="220" y2="200" 
          stroke-linecap="round" 
          stroke-width="3"/>
  </g>
</svg>
